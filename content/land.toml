# LAND AND METAL (spec 6.4, 6.5).
#
# The response tables are the whole balance of agriculture. Each is read with
# `lerp_table(table, x)` -- integer linear interpolation over authored points --
# and returns a 0..1000 multiplier applied in the fixed order documented in
# engine/land.py. The player never sees any of this, only proxies (6.4).

# x = mean climate index over the growing season (0..200, 100 = normal).
# Deliberately asymmetric: a wet year is worth less than a dry year costs. Rain
# beyond sufficiency does nothing, drought takes everything.
[tables]
water_response = [
  [0, 0], [40, 120], [60, 380], [80, 720], [95, 950],
  [100, 1000], [120, 1060], [150, 1080], [200, 1000],
]

# x = 1000 * labour_days_supplied // labour_days_needed.
# Note the shoulder: the first shortfall is nearly free (there is slack in any
# harvest), and then it is not. A court that pulls the garrison off the fields
# every year will not notice for two years and cannot recover in the third.
labour_response = [
  [0, 0], [250, 260], [500, 560], [750, 830], [900, 960],
  [1000, 1000], [1200, 1030],
]

# x = 1000 * seed_sown // seed_recommended.
# Near-linear and unforgiving, because it is: land sown at half rate yields
# about half. This is where `eat seed` finally presents its bill, 19 turns on.
seed_response = [
  [0, 0], [250, 270], [500, 530], [750, 790], [1000, 1000], [1200, 1040],
]

# x = canal_condition (0..1000). Spec 6.4: "falls off a cliff below 300", so
# one year of neglect is recoverable and two are not.
canal_response = [
  [0, 0], [100, 60], [200, 150], [300, 420], [500, 760],
  [750, 930], [1000, 1000],
]

[agriculture]
# Labour a single head supplies per fortnight when working the fields.
labour_days_per_head = 12
# Corvee: raised by the crown outside the dependent lists, paid for in unrest.
corvee_unrest_per_1000_days = 40
corvee_max_days = 6000
# Canal condition decays every turn and is restored only by dredging in the
# authored low_water window.
canal_decay_per_turn = 60
canal_dredge_per_1000_days = 90

[metal]
# The bronze chain (spec 6.5). 9:1 copper to tin by weight; the *10 keeps the
# arithmetic in shekels of finished bronze.
copper_per_tin = 9
bronze_per_batch = 10
# What a formation cannot re-equip below. Authored per formation in the
# scenario; this is the floor for anything that does not name one.
default_equipment_floor = 0
# Bronze in service wears, is lost, is buried with its owner and goes out as a
# gift. Per ten thousand, per fortnight, and it happens whether or not the forge
# is working -- which is what makes the forge worth paying for. See the note in
# engine/metal.py: without this, starving the smiths *preserved* the army.
# 100 per 10,000 is 1% a fortnight, about a quarter of the kit a year. Swept
# across 16 seeds: at 60 four seeds still ended with a perfect replacement rate,
# at 180 the army is gone by turn 60 on every seed. At 100 no seed ends whole
# and none ends at nothing.
bronze_attrition_per_10000 = 100
