# Authored letter templates (spec 8.7 fallback prose; the model rewrites these
# from M7). The summary is the scribe's line -- cheap, always available. The
# template is the full body -- costs hours to read. {placeholders} are filled
# from the letter's structured facts; no number appears that wasn't authored.

[grain_owed]
summary = "Hatti. Grain owed under oath."
template = """To Ammurapi of Ugarit: thus the Sun, Great King, your lord.
The grain owed under oath has not arrived. You promised {ships_promised} ships; {ships_sailed} have sailed. Send the remaining grain and write to me."""

[grain_owed.labels]
ships_promised = "ships you were promised"
ships_sailed = "ships that have actually sailed"
[ships_sighted]
summary = "Alashiya. The governor reports ships off the coast."
template = """To the king of Ugarit: thus {sender}, your servant.
{ships} ships not our own were seen off the coast. I have {men} men under arms. My earlier letter has no answer. Send men and instructions."""

[ships_sighted.labels]
men = "men you have under arms on the island"
ships = "ships seen off your coast"
[exemption]
summary = "Sinaranu asks for a lower harbour toll."
template = """To my lord the king: thus {sender}, your servant.
Lower the harbour toll on ships from Crete. My ship brings oil and copper for your house. Set a lower rate for all ships if you agree. Send your decision."""

[greeting]
summary = "Egypt. Pharaoh sends gold and asks for news."
template = """To my brother, the king of Ugarit: thus the Sun, king of Egypt.
May it be well with you and your house. I sent {gold} talents of gold as a gift. Write of your health and the ships passing your harbour."""

[greeting.labels]
gold = "talents of gold you have sent him"
[arrears_complaint]
summary = "A palace group reports unpaid rations."
template = """To the king, my lord: thus {sender}, of {group}.
Our ration has not arrived for {weeks} fortnights. Pay what is owed and send instructions."""

[arrears_complaint.labels]
group = "the body of people you belong to"
weeks = "fortnights your ration has not come"
[great_king_demand]
summary = "The viceroy summons troops by a stated date."
template = """To Ammurapi: thus {sender}.
By the Great King’s command, send {troops} household troops within {within} fortnights. Send them armed and report their departure."""

[great_king_demand.labels]
troops = "household troops you are summoning"
within = "fortnights he has to send them"
[vassal_plea]
summary = "A ruler asks for help against an invading enemy."
template = """To the king of Ugarit, my brother: thus {sender}.
{enemy} have taken {towns_taken} of my towns. My earlier letters have no answer. Send help and write to the Sun on my behalf."""

[vassal_plea.labels]
enemy = "who is taking them"
towns_taken = "towns of yours that have been taken"
[tribute_due]
summary = "Sidon. The promised purple has not arrived."
template = """To my brother, the king of Ugarit: thus {sender}.
The {purple} measures of purple promised for the temple have not arrived. Send them on the next ship."""

[tribute_due.labels]
purple = "measures of purple you were promised"
[brother_greeting]
summary = "A foreign king sends a gift and asks about Egypt."
template = """To Ammurapi, my brother: thus {sender}.
May it be well with you and your house. I send {number} of {gift}. Write of your health and the gifts Egypt sent you."""

[brother_greeting.labels]
gift = "what you are sending"
number = "how many you are sending"
[grain_offer]
summary = "Ura. Grain offered at a stated copper price."
template = """To the house of the king of Ugarit: thus {sender}.
I offer {grain} qa of grain. The quoted price is {price_copper} copper. Send your answer before the sea closes."""

[grain_offer.labels]
grain = "qa of grain offered"
price_copper = "quoted copper price"
[gift_insult]
summary = "A foreign ruler rejects the value of your gift."
template = """To the king of Ugarit.
Your gift was weighed: {quantity} of {good}. This is less than my house expects. Send a fitting gift."""

[gift_insult.labels]
good = "what he sent you"
quantity = "how much he sent you"
[warning]
summary = "A foreign court sends a warning."
template = """To the king of Ugarit: thus {sender}.
This is the report I received: {enemy}. Set your coast watch."""

[warning.labels]
enemy = "what you have heard of"
ships = "ships said to be moving"

[estate_report]
summary = "An estate overseer asks for field workers."
template = """To the king, my lord: thus {sender}, your servant.
At {estate}, {sown} hundred measures were sown. We lack {hands_short} hundred labour-days before the season closes. Send workers, or write that none are coming."""

[estate_report.labels]
estate = "which estate you are writing about"
hands_short = "hundreds of labour-days you are short of"
sown = "hundreds of measures of seed that went into your ground"

[daughter_abroad]
summary = "Your daughter reports from her husband’s court."
template = """To the king my father: thus your daughter, at {court}.
May it be well with you and my family. My standing here is reported as {regard}. This court owes your house {their_debt} hundreds. I report what I hear. Remember that I also belong to this house."""

[daughter_abroad.labels]
court = "the court you now live in"
regard = "how highly you are held there, as you would like it understood"
their_debt = "hundreds that court owes your father's house"
