# THE PREDECESSOR ARCHIVE OF UGARIT (spec 6.12, 6.17)
#
# These documents exist before turn 1. They are what is already in the room when
# the player sits down: four generations of tablets, most of them worthless,
# some of them not.
#
# THE ARGUMENT. Two vows below name festivals no longer present on Ammurapi's
# calendar; a third names one still kept. Priests, rivals, and the ruler may use
# those records to interpret later sickness or misfortune. The archive contains
# evidence for their reasoning, not an objective divine cause in engine state.
#
# `received_turn` is negative: these arrived before the game began, and the
# archive sorts by received_turn only (6.17), so they sit at the top of every
# result set. The oldest thing in the room is the thing nobody has read.
#
# `dated_as` is the sender's own regnal date. It is NOT comparable to the
# player's calendar or to any other sender's. That is the point of the field.

# ─────────────────────────────────────────────────────────────────────────────
# THE THREE VOWS. Each has a live Oath object in the scenario file; these are
# the documents that record them.
# ─────────────────────────────────────────────────────────────────────────────

[[documents]]
ref = "PA-UG-003"
kind = "oath"
received_turn = -240
sender = "niqmaddu_iii"
dated_as = "yr 2 of Niqmaddu, Hiyaru, latter half"
title = "the vow of Niqmaddu to Baal of Saphon"
tags = ["vow", "oath", "baal", "saphon", "festival", "rain", "predecessor"]
body = """
Niqmaddu, king of Ugarit, servant of Baal of Saphon, in the second year.

In the year the rain did not come and the wells of Ma'hadu went bitter, I went
up the mountain and I swore before Baal of Saphon and before the assembly of
the gods: that the festival of the first rain shall be kept in the house of
Baal in the latter half of Hiyaru, in that fortnight and no other, with a bull
and with grain, by me and by my sons and by the sons of my sons, so long as
there is a king in Ugarit.

The rain came in the third year. Let it be written that the rain came.
"""

[[documents]]
ref = "PA-UG-011"
kind = "oath"
received_turn = -186
sender = "ammistamru_ii"
dated_as = "yr 9 of Ammistamru, Abu, former half"
title = "the vow of Ammistamru concerning the dead of the plague"
tags = ["vow", "oath", "dagan", "plague", "sickness", "festival", "predecessor"]
body = """
Ammistamru, king of Ugarit, in the ninth year, when the sickness had passed
from the city.

Before Dagan and before Baal I have sworn: that in the former half of Abu, in
every year, the house of the king shall set out bread and beer for the dead of
the sickness at the gate of the city, and the king himself shall stand there,
and shall not send another in his place.

I have counted the dead of my household at eleven. I have not counted the dead
of the city. Let no one say afterwards that the number was not written, for it
was not possible to write it.
"""

[[documents]]
ref = "PA-UG-019"
kind = "oath"
received_turn = -122
sender = "niqmepa_vi"
dated_as = "yr 14 of Niqmepa, Simanu, former half"
title = "the vow of Niqmepa at the founding of the granary"
tags = ["vow", "oath", "baal", "granary", "festival", "harvest", "predecessor"]
body = """
Niqmepa, king of Ugarit, in the fourteenth year.

When the new granary was built at the seat I swore before Baal that the rite of
the threshing floor should be kept in the former half of Simanu with the
first grain of the harvest, and that the first grain should not be sold, nor
given to any king, nor put on any ship, before it had been set before the god.

This I have kept in every year of my reign.
"""

