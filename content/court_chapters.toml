# Advisory campaign chapters. These describe existing public records and offer
# voluntary aims; they create no crises, deadlines, victories, or rewards.
[seat]
name = "Ugarit"
identity = "A coastal kingdom owing grain and troops to Hatti. The palace must divide stores between households, fields and the coast watch."
first_title = "First accounts"
first_summary = "Keep rations paid until harvest. Read Hatti’s demands before promising grain or troops."
harvest_title = "Harvest"
harvest_summary = "Assign enough workers to gather the crop. Keep grain for seed and household rations."
sowing_title = "Sowing"
sowing_summary = "Reserve seed for the next crop. Compare the ration roll with the grain remaining."
succession_title = "Succession"
succession_summary = "The new ruler inherits estates, judgements, ration debts and foreign obligations."
pressure_title = "Threats and sickness"
pressure_summary = "Check the watch, sick households and supply routes. Keep grain for the ration roll."
continuity_title = "Another grain year"
continuity_summary = "Read the current field account, ration debts and Hatti’s replies before giving new orders."
endurance_title = "Later years"
endurance_summary = "Review unpaid debts, field labour and unanswered letters. Name an heir."
goals = ["food", "harvest", "hatti"]

[byblos]
name = "Gubla"
identity = "A cedar-exporting port with a large palace household. Egypt is a foreign patron; Amurru is a rival."
first_title = "First accounts"
first_summary = "Hear the cedar cutter’s claim. Maintain grain reserves and answer Pharaoh’s letters."
harvest_title = "Harvest"
harvest_summary = "Gather the crop and rebuild grain reserves. Check rations owed to timber workers."
sowing_title = "Sowing"
sowing_summary = "Compare village dues with the grain needed for seed and household rations."
succession_title = "Succession"
succession_summary = "Read the old settlements and foreign promises before sealing new orders."
pressure_title = "Pressure on the coast"
pressure_summary = "Read Pharaoh’s replies and the watch reports. Check that promised goods remain available."
continuity_title = "Returned claims"
continuity_summary = "Read earlier settlements and Pharaoh’s answers before promising more grain."
endurance_title = "Later years"
endurance_summary = "Check old settlements, current claimants and the succession."
goals = ["food", "claims", "pharaoh"]

[tyre]
name = "Tyre"
identity = "A fortified island port. Imported food and repair materials must pass through the quay."
first_title = "First accounts"
first_summary = "Keep grain in reserve and the quay in repair. Read Sidon’s letters."
harvest_title = "Harvest"
harvest_summary = "Gather the mainland crop. Keep the quay ready for imported grain."
sowing_title = "Sowing"
sowing_summary = "Reserve seed and ration grain. Inspect the quay before the sailing season."
succession_title = "Succession"
succession_summary = "The new ruler inherits the fortifications, foreign relations and outstanding promises."
pressure_title = "Supply routes"
pressure_summary = "Check the quay, ration reserve and letters from Sidon. Threats and sickness may interrupt supplies."
continuity_title = "Between sailing seasons"
continuity_summary = "Read the quay report and grain reserve before giving orders or answering Sidon."
endurance_title = "Later years"
endurance_summary = "Maintain food supplies and the quay. Review promises and name an heir."
goals = ["food", "harbour", "sidon"]

[carchemish]
name = "Carchemish"
identity = "A river court serving Hatti, with a large army and palace ration roll. Two adult sons may claim the succession."
first_title = "First accounts"
first_summary = "Keep grain for the army and palace. Read the summons and name an heir."
harvest_title = "Harvest"
harvest_summary = "Assign workers to gather the crop before sending troops on campaign."
sowing_title = "Sowing"
sowing_summary = "Reserve seed and ration grain while answering Hatti’s demands."
succession_title = "Succession"
succession_summary = "The new ruler inherits service obligations and the palace ration roll."
pressure_title = "Troop demands"
pressure_summary = "Read the summons and muster roll before sending men from the home garrison."
continuity_title = "Another service year"
continuity_summary = "Check current troop assignments, ration reserves and the household before promising more service."
endurance_title = "Later years"
endurance_summary = "Keep grain in reserve. Check troop assignments and the succession."
goals = ["food", "muster", "heir"]

[alashiya]
name = "Alashiya"
identity = "A copper-exporting island kingdom with limited farmland and scarce tin. Food imports depend on sea routes."
first_title = "First accounts"
first_summary = "Keep grain in reserve. Give the keeper a grain purchase order and check the forge’s tin supply."
harvest_title = "Harvest"
harvest_summary = "Gather the island crop. Compare reserves and expected grain purchases with the ration roll."
sowing_title = "Sowing"
sowing_summary = "Reserve seed for the island fields. Check how much grain must be bought."
succession_title = "Succession"
succession_summary = "The new ruler inherits metal stores and grain purchases. Review the keeper’s instructions."
pressure_title = "Supply routes"
pressure_summary = "Check the routes and grain sellers. The keeper needs copper and available grain to buy supplies."
continuity_title = "Grain purchases"
continuity_summary = "Read the keeper’s receipts and forge demand. Review the spending limit and local grain for sale."
endurance_title = "Later years"
endurance_summary = "Review food purchases, repair metal and the succession."
goals = ["food", "tin", "mandate"]

[pylos]
name = "Pylos"
identity = "Mycenaean palace kingdom. The wanax rules with estate officials and a military commander. The palace allocates bronze to smiths and rations to weaving households. This royal household is fictional."
first_title = "First accounts"
first_summary = "Read the bronze account and ration roll. Supply the workshops before the six-fortnight allocation closes. Keep men on the coast watch."
harvest_title = "Harvest"
harvest_summary = "Keep estate workers fed. Reserve enough labour for the crop before assigning palace works."
sowing_title = "Sowing"
sowing_summary = "Set aside seed and cover the estate work. Review the next bronze allocation before spending metal elsewhere."
succession_title = "Succession"
succession_summary = "Name an heir and review the household offices. The workshop allocation continues under the new ruler."
pressure_title = "Watch and supplies"
pressure_summary = "Read the coast reports. Keep a home force and enough grain for the palace roll."
continuity_title = "Next allocation"
continuity_summary = "Read the last workshop settlement. Stock bronze and feed the smiths before the next allocation closes."
endurance_title = "Later years"
endurance_summary = "Review the grain reserve, bronze stock and succession. The palace must meet the next allocation from its current stores."
goals = ["food", "governance", "muster"]

[egypt]
name = "Pi-Ramesses"
identity = "Egyptian royal court in the Delta. Pharaoh governs through officials, estate deliveries and temple institutions. The crown funds a temple allocation every six fortnights. This royal household is fictional."
first_title = "First accounts"
first_summary = "Read the ration roll and land dues. Keep grain for the temple allocation and the royal households."
harvest_title = "Harvest"
harvest_summary = "Keep estate workers fed and gather the crop. Compare the land dues with the grain delivered."
sowing_title = "Sowing"
sowing_summary = "Set aside seed. Keep enough grain for households and the next temple allocation."
succession_title = "Succession"
succession_summary = "Name the next ruler and review the household offices. The granaries and temple allocation pass with the seal."
pressure_title = "Grain and garrisons"
pressure_summary = "Read the reports before sending troops. Keep the royal roll fed and hear claims against the ration clerks."
continuity_title = "Provincial accounts"
continuity_summary = "Compare dues, deliveries and ration debts. Review the last temple allocation before the next one closes."
endurance_title = "Later years"
endurance_summary = "Keep a grain reserve and a named successor. Review estate work and temple allocations from the current accounts."
goals = ["food", "governance", "heir"]

[hattusa]
name = "Hattusa"
identity = "Hittite imperial capital. The Great King governs his court and bargains with subordinate rulers. A six-fortnight service account requires three campaign musters or grain for the garrison. This royal household is fictional."
first_title = "First accounts"
first_summary = "Read the vassals' tablets and the muster roll. Keep enough grain for the capital and choose an heir."
harvest_title = "Harvest"
harvest_summary = "Feed the estate workers and gather the crop. Keep a home force while assigning men to distant campaigns."
sowing_title = "Sowing"
sowing_summary = "Reserve seed and estate labour. Read the vassals' requests before promising more troops."
succession_title = "Succession"
succession_summary = "Review the heirs and household offices. The next ruler inherits the vassal letters and the muster obligations."
pressure_title = "Vassals and the border"
pressure_summary = "Read the warnings and pleas. Keep a home force and keep the royal service account supplied."
continuity_title = "Next service review"
continuity_summary = "Read the last service account. Provision the garrison or maintain the campaign contingent before the next account closes."
endurance_title = "Later years"
endurance_summary = "Review the grain reserve, vassal correspondence and succession. Authority depends on troops and accounts that still hold."
goals = ["food", "governance", "heir"]
