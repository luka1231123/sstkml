[case_overrides]

[case_overrides.debt_shipwright]
claim_text = "Itur the smelter says the palace owes him 9,000 copper shekels."
counter_text = "The palace factor says contaminated ore returned; he offers 3,000."
petitioner = "alashiya_abdi_anu_shipwright"
against = "alashiya_kuppiya_factor"

[case_overrides.injury_quarry]
claim_text = "Resheph the mine cutter's crushed hand leaves his household owed 60,000 qa."
counter_text = "The foreman blames Resheph the mine cutter and offers 20,000 qa."
petitioner = "alashiya_arwanu_stonemason"
against = "alashiya_biriyawaza_foreman"

[case_overrides.widows_ration]
claim_text = "the drowned ore porters’ households ask the palace for 180,000 qa."
counter_text = "the ration clerk says only this season is owed: 60,000 qa."
petitioner = "alashiya_ship_porters_widows"
against = "alashiya_zakarbaal_collector"

[case_overrides.shipwright_balance]
claim_text = "Paid {paid:,} on turn {turn}; Itur the smelter asks for {balance:,} more."
counter_text = "the palace factor: keep the first settlement. Pay no more."
petitioner = "alashiya_abdi_anu_shipwright"
against = "alashiya_kuppiya_factor"

[case_overrides.shipwright_bread]
claim_text = "The {paid:,} copper settled it. Now Itur the smelter asks 18,000 qa for his household."
counter_text = "the palace factor: he has his copper. Keep grain for the roll."
petitioner = "alashiya_abdi_anu_shipwright"
against = "alashiya_kuppiya_factor"

[case_overrides.injury_quarry_balance]
claim_text = "The injury judgement gave our household {paid:,} qa. We ask for the remaining {balance:,} of the original claim; the judgement is still on the tablet."
counter_text = "The foreman asks the king to keep the first settlement. Reopening it spends grain already needed by the ration roll."
petitioner = "alashiya_arwanu_stonemason"
against = "alashiya_biriyawaza_foreman"

[case_overrides.widows_ration_balance]
claim_text = "Twelve fortnights after judgement, the widows bring its receipt: {paid:,} qa paid of their 180,000 claim. They ask {balance:,} more."
counter_text = "The collector says the king settled that disputed claim already. Let the earlier award stand and keep the grain for living obligations."
petitioner = "alashiya_ship_porters_widows"
against = "alashiya_zakarbaal_collector"

