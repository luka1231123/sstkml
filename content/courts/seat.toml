# ─────────────────────────────────────────────────────────────────────────────
# PLAGUE. The import below is a design reconstruction, not a claim for a dated
# historical outbreak: infected travellers from beyond the scenario boundary
# reach the port of Ma'hadu in the sixth month.  From there disease can move
# only with journeys represented in the simulation.
# ─────────────────────────────────────────────────────────────────────────────
[plague]
# beta must exceed gamma + mortality or the epidemic cannot grow at all: the
# basic reproduction number is beta / (gamma + mortality), and at 240/270 the
# sickness burns out from any seeding, silently and every time. At 520 it is
# about 1.9, which over a fortnightly step is an epidemic that runs for roughly
# two years and takes a tenth of the city -- the right order for the period.
beta = 520          # transmission per mille per fortnight
gamma = 180         # recoveries per mille of the infected
mortality = 90      # deaths per mille of the infected
exposure = 45       # chance in 1000 that an arrival from a sick place seeds
import_place = "ma_hadu"
import_turn = 12
import_cases = 8

[[rites]]
id = "new_year_baal"
fortnight = 1
hours = 3
requires = { grain = 400, wine = 60, oil = 20 }
skip_legitimacy = -180
skip_unrest = 120

[[rites]]
id = "first_fruits"
fortnight = 9
hours = 2
requires = { grain = 300, oil = 10 }
skip_legitimacy = -80
skip_unrest = 40
