# same stores, cohorts, and obligations Ugarit uses.
#
# `need` is the fortnightly draw against `stores`; `floor` is what the court
# keeps back whatever it is asked. Egypt can spare grain and knows it. Alashiya
# is a copper island that eats imported bread and will say no. Ura sells rather
