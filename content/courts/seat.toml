[[correspondents]]
actor = "alashiya_gov"
place = "alashiya"
cadence = 3
offset = 0
topic = "ships_sighted"
facts = { ships = 12, men = 30 }
exaggerate = ["ships"]          # the spec's own example (8.6): he is frightened
understate = ["men"]            # and wants troops, so his garrison shrinks
[[correspondents]]
actor = "pharaoh"
place = "egypt"
cadence = 9
offset = 4
topic = "greeting"
