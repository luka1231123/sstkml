# ─────────────────────────────────────────────────────────────────────────────
# THE WORLD, AS THE COURT HAS IT DRAWN (spec 6.6). Two things live here: the
# ground, and the places standing on it. Neither is ever read by a rule --
# distance in this game is counted in courier legs and in nothing else, so
# every coordinate below can be wrong by a day's walk without one number in the
# simulation changing.
