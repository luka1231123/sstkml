# ── Routes. legs = fortnights. Sea legs are seasonal; land and river stay open
# all winter -- so in winter the Hittite and Syrian letters keep coming and the
# sea ones simply stop. Risk is the base interception/loss weight (0..1000).
# The graph has real chokepoints: Emar gates the eastern tin road, Carchemish
# gates the Hittite plateau.

