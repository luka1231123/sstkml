# Ammurapi of Ugarit (spec 7.2).
# Wealthy because everyone passes through, sworn to Hatti, militarily hopeless.
# The tightest, cleanest ruleset -- the default and the tutorial.
# Grain comes off a threshing floor once a year (M8); what the fields return is
# opaque, and the player reasons about it from proxies.
# The economy runs a structural deficit: you cannot feed everyone forever.
# The game is the order in which you let them starve.

scenario = "ugarit"
actor = "ammurapi"
seat = "seat"
attention_base = 10
# Small standing deliveries that are not the harvest: garden plots, fishponds,
# olive and vine renders, the odd tribute in kind. The harvest itself now comes
# once a year off the threshing floor (M8, superseding D4).
grain_income = 4000

# The predecessor's harvest, and the one datum about the land the player can
# actually trust on turn one (spec 6.4). Everything else he learns about the
# fields is a proxy: a gauge reading copied by a tired hand, or an overseer with
# an interest in the answer.
last_harvest = 1050000

# Turn one falls at fortnight 1, two fortnights into a growing season the
# predecessor began. Bank those two, so year one is a normal year and the
# player's first `last_harvest` is a number he can reason from.
opening_growing_turns = 2

# Names drawn for children born in play, so a new person is an authored name.
house_names_f = [
  "Sharelli", "Tarriyelli", "Pidray", "Talaya", "Arsay", "Batshamem",
  "Ummi-hebi", "Nikkal-mati",
]
house_names_m = [
  "Niqmaddu", "Ibiranu", "Ammistamru", "Yaqarum", "Arhalba", "Niqmepa",
  "Ilimilku", "Abdi-anati",
]

# Names for the faces of a ration cut (spec 6.3). One is drawn per group at load.
names = [
  "Abdi", "Rap'anu", "Sinaranu", "Kurwanu", "Ili-milku",
  "Takhulinu", "Munahhimu", "Ewri-sharri", "Baaluya", "Yadudanu",
]

# Pay-down order when grain runs short. The single most important screen.
# Feeding the people who bring in the harvest before the people who guard it is
# the right answer and the game should not hide it -- but it is only the right
# answer until the season the coast is raided.
priority = ["household", "field_hands", "garrison_mahadu", "cult_baal", "smiths_palace", "weavers"]

# The palace scribe who copies every number the ruler reads (spec 6.7). Ugarit's
# ruler is literate, but the granary is still counted by a tired junior hand.
# p_error = fatigue * (1000 - competence) / 1000  ->  here ~100 permille.
[scribe]
competence = 800
fatigue = 500

# Opening stores. Grain is roughly ten fortnights of full entitlement, so the
# granary is visibly falling from turn one and the inherited harvest at
# fortnight 12 is a genuine relief rather than a formality.
#
# seed_grain opens at NOUGHT, and that is not an oversight: the game begins at
# fortnight 1, mid-growing-season, so the predecessor's seed is already in the
# ground. The store refills off the threshing floor at fortnight 12 and empties
# into the fields again at 19, which means there is exactly one window a year --
# six fortnights, f13 to f18 -- in which seed grain is a thing you could eat.
# Doing so is free that turn and ruinous at the next threshing (spec 6.2).
[stores]
grain = 820000
seed_grain = 0
oil = 4000
wine = 3000
copper = 36000
tin = 1800
bronze = 900

[[groups]]
id = "household"
name = "the king's household"
size = 120
entitlement = 100
function = "household"
place = "seat"

[[groups]]
id = "garrison_mahadu"
name = "garrison at Ma'hadu"
size = 60
entitlement = 90
function = "garrison"
place = "ma_hadu"

[[groups]]
id = "cult_baal"
name = "servants of the temple of Baal"
size = 80
entitlement = 80
function = "cult"
place = "seat"

[[groups]]
id = "smiths_palace"
name = "smiths of the palace quarter"
size = 140
entitlement = 70
function = "bronze_working"
place = "seat"

[[groups]]
id = "weavers"
name = "weavers of the queen's house"
size = 210
entitlement = 60
function = "weaving"
place = "seat"

# The people who actually bring the harvest in. Starve them and the fields go
# short of hands, which does nothing at all until the following threshing.
[[groups]]
id = "field_hands"
name = "field hands of the crown estates"
size = 400
entitlement = 40
function = "field_labour"
place = "seat"

# The sea shuts outside this window (spec 3.2). Nine fortnights of frozen
# information, then the spring flood. sailing_open is inclusive [7, 21].
#
# The farming year is Levantine and rain-fed: sow after the first autumn rains,
# grow through the wet winter, cut barley then wheat in late spring, thresh on
# the floor before high summer. low_water is authored but idle here -- Ugarit
# has no canals, and the window exists for the Delta and Mesopotamian
# scenarios that arrive in M12.
[season]
sailing_open = [7, 21]
sowing       = [19, 22]
growing      = [23, 7]
harvest      = [8, 11]
threshing    = [12, 13]
low_water    = [14, 18]

# The twelfth-century downturn (spec 6.4). x = regnal year, y = the climate
# baseline that year, 100 = normal. The whole series is drawn at scenario start
# and nothing that happens later can perturb it: a bad year was always going to
# be a bad year, and this is what lets divination read a true future value.
# The curve is gentle and long. No single year announces a crisis.
[climate]
drought_curve = [
  [0, 104], [1, 100], [2, 97], [3, 99], [4, 92],
  [5, 88], [6, 91], [7, 82], [8, 78], [9, 74], [12, 68],
]

# ── The land (spec 6.4). Yields are opaque: the player sees a gauge reading he
# did not take, letters from overseers with their own interests, and last
# year's number. The game opens with the predecessor's crop already sown, so
# year one is inherited and only year two answers to the player.
#
# Full inputs, normal year: 1,188,000 qa against 1,492,800 qa of ration
# entitlement. The deficit is deliberate (D4) and structural: the game is the
# order in which groups are let go, not whether everyone can be fed.
[[estates]]
id = "royal_lands"
name = "the royal lands about the city"
place = "seat"
area_iku = 2400
base_yield_per_iku = 145
seed_per_iku = 10
labour_days_per_iku = 6

[[estates]]
id = "siyannu"
name = "the plain of Siyannu"
place = "gibala"
area_iku = 2200
base_yield_per_iku = 140
seed_per_iku = 10
labour_days_per_iku = 6

[[estates]]
id = "ilishtamai"
name = "the fields of Ilishtamai"
place = "seat"
area_iku = 2000
base_yield_per_iku = 140
seed_per_iku = 10
labour_days_per_iku = 6

[[estates]]
id = "temple_lands"
name = "the lands of the house of Baal"
place = "ma_hadu"
area_iku = 1800
base_yield_per_iku = 140
seed_per_iku = 10
labour_days_per_iku = 6

# ── Metal (spec 6.5). Copper is near, at Alashiya, and there is plenty of it.
# Tin comes the long eastern road through Emar, Mari and Assur, and there is
# half a talent of it. Nothing warns about this and nothing is meant to.
[metals]
bronze_in_circulation = 24000   # tools, weapons, chariot fittings in use
melt_ledger = 0

[[workshops]]
id = "palace_forge"
name = "the palace forge"
group_id = "smiths_palace"
bronze_demand = 600             # shekels a fortnight, maintenance and replacement

# ── The city as a machine (spec 6.18). Every one of these is staffed by a group
# that is already on the payroll above: the institution and the ration line are
# the same decision seen twice. `condition` is the fabric and it decays every
# fortnight whether or not anyone is working. Nothing announces it.
#
# `head` is empty on purpose for the walls and the tablet house. A vacant post
# costs 40 a fortnight, and filling it is what the house is *for* (6.22).
[[institutions]]
id = "harbour_mahadu"
name = "the harbour of Ma'hadu"
kind = "harbour"
place = "ma_hadu"
group = "garrison_mahadu"
head = "harbourmaster"
condition = 820
capacity = 1000                 # cargoes clearable, per thousand
upkeep = {oil = 6}

[[institutions]]
id = "granary_seat"
name = "the great granary"
kind = "granary"
place = "seat"
group = "household"
head = "steward_granary"
condition = 760
capacity = 1000                 # storage, per thousand of the authored capacity

[[institutions]]
id = "forge_palace"
name = "the palace forge"
kind = "workshop"
place = "seat"
group = "smiths_palace"
head = "master_smith"
condition = 880
capacity = 600                  # shekels of bronze a fortnight, whole and fed

[[institutions]]
id = "temple_baal"
name = "the temple of Baal"
kind = "temple"
place = "seat"
group = "cult_baal"
head = "high_priest"
condition = 900
capacity = 1000                 # rites supportable, per thousand
upkeep = {oil = 10}

[[institutions]]
id = "walls_seat"
name = "the walls of Ugarit"
kind = "walls"
place = "seat"
head = ""
condition = 640                 # nobody has minded them in two reigns
capacity = 1000                 # defence weight, per thousand

[[institutions]]
id = "tablet_house"
name = "the tablet house"
kind = "archive"
place = "seat"
head = ""
condition = 700
capacity = 1000                 # hits returned, per thousand

# Spec 7.2: `troops` total under 400, and there is no military solution to
# anything. 390 across three formations, which is the whole army: enough to hold
# the seat OR to answer the muster at Carchemish OR to bring in a harvest, and
# never two of them (D25, D32). `task` and `place` are the starting orders and
# the player may change any of them for an hour.
[[formations]]
id = "chariotry"
name = "the maryannu chariotry"
strength = 90
equipment_floor = 18000         # fittings, armour, and the fear they carry
task = "garrison"
place = "seat"

[[formations]]
id = "household_troops"
name = "the household troops"
strength = 260
equipment_floor = 9000
task = "garrison"
place = "seat"

# The four men in a tower of spec 7.2, and they are forty. A watch counts half
# against a raid, because a watch is men who can see a sail coming.
[[formations]]
id = "coast_watch"
name = "the watch on the coast"
strength = 40
equipment_floor = 2000
task = "watch"
place = "ma_hadu"

# ─────────────────────────────────────────────────────────────────────────────
# THE HOUSE (spec 6.10). A cast, not a stat block. Ages in years; the engine
# keeps fortnights. Everyone here writes letters eventually, and not all of
# them are on your side.
#
# Ammurapi is the last king of Ugarit. He has two sons -- which is one more than
# most houses manage and one fewer than is comfortable -- a daughter of
# marriageable age who is the most valuable diplomatic instrument he owns, and
# a mother who has her own estates, her own revenues, and her own view about
# which of her grandsons should follow.
# ─────────────────────────────────────────────────────────────────────────────

[[house]]
id = "ammurapi"
name = "Ammurapi"
sex = "m"
age_years = 34
health = 720
spouse = "ehli_nikkalu"
own_agenda = "hold the house together"

[[house]]
