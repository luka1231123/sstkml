# ─────────────────────────────────────────────────────────────────────────────
# THE VOWS OF THE PREDECESSORS (spec 6.12). `binds_house = true`: a promise to a
# king dies with the man, a promise to a god does not. These three are still
# binding on Ammurapi, who did not make any of them.
#
# Two of them name festivals that are NOT in the rite list below, so the court
# can read them as broken every year. The third names `first_fruits`, which IS
# kept. These are historical and religious records, not hidden causes of
# material events. The tablets recording all three are in the predecessor
# archive.
# ─────────────────────────────────────────────────────────────────────────────

[[oaths]]
id = "vow_first_rain"
parties = ["ammurapi", "baal_saphon"]
superior = ""
gods = ["baal_saphon", "el"]
sworn_turn = -240
