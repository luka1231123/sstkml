# Old enough to be sent. Whoever receives her gains a permanent tie and you
# gain the best correspondent you will ever have, who is not your servant.
[[house]]
id = "pidray"
name = "Pidray"
sex = "f"
age_years = 17
health = 780
mother = "ehli_nikkalu"
father = "ammurapi"
own_agenda = "marry well and be remembered at home"

# The diviner reads the liver for you. He is competent, reasonably loyal, and
# belongs to the temple, which has views about whether the king should stay
# home and keep the rites (spec 6.11).
[diviner]
competence = 640
loyalty = 700
faction = "temple"
# ─────────────────────────────────────────────────────────────────────────────
# THE WORLD, AS THE COURT HAS IT DRAWN (spec 6.6). Two things live here: the
# ground, and the places standing on it. Neither is ever read by a rule --
# distance in this game is counted in courier legs and in nothing else, so
# every coordinate below can be wrong by a day's walk without one number in the
# simulation changing.
#
# THE GROUND is the block of `rows` below: one character per cell, drawn from
# the real relief and hydrography of the eastern Mediterranean, and authored
# from here on. `west`/`north` are the degrees at column 0 and row 0 and
# `step_lon`/`step_lat` how much ground a cell covers, so a place with a real
# latitude can be turned into a column and a row once, by hand, and then left
# alone. Editing the map is editing these rows: change a `.` to a `^` and there
# is a mountain there. Nothing in `tui/` holds a coastline.
#
#   ~ sea     ≈ river    ^ hill or mountain
#   , sown    . dry      : desert      ; marsh
#
# THE PLACES carry `col` and `row` into that block, `power` (whose empire they
# answer to), `rank` (imperial seat, royal seat, town -- which decides how the
# mark is drawn) and `glyph`, the letter inside the brackets. `role` is the one
# line the tablet writes about a place when it is selected.
#
# Beneath them are `sites`: the hinterland. Small palaces, grain estates and
# metal sources, each belonging to a hub, each with no name -- they are what
# the hinterland of a great house looks like from the capital, which is a
# number of holdings and not a list of towns. More of them can be added freely;
# nothing breaks if a hub has none.
# ─────────────────────────────────────────────────────────────────────────────

[terrain]
west = 21.00          # degrees east at column 0
north = 41.00         # degrees north at row 0
step_lon = 0.080      # degrees of longitude a column covers
step_lat = 0.135      # degrees of latitude a row covers
legend = "~ sea · ≈ river · ^ upland · , sown · . dry · : desert · ; marsh"
