# ─────────────────────────────────────────────────────────────────────────────
# THE VOWS OF THE PREDECESSORS (spec 6.12). `binds_house = true`: a promise to a
# king dies with the man, a promise to a god does not. These three are still
# binding on Ammurapi, who did not make any of them.
#
# Two of them name festivals that are NOT in the rite list below, so they are in
# violation from turn 1 and accrue liability every year, silently. The third
# names `first_fruits`, which IS kept, so it never accrues and can never be the
# cause -- a reader who checks the calendar can eliminate it, and that is the
# one clean deduction the puzzle offers. The tablets recording all three are in
# content/corpus/predecessor_archive/ugarit.toml.
# ─────────────────────────────────────────────────────────────────────────────

