# ── Who writes, and how often. `facts` are TRUE at the moment of writing; what
# the tablet asserts is these figures run through the sender's `report_bias`
# (below) in the direction of his interest. `exaggerate` is what he has a motive
# to inflate -- threats, enemies, what he is owed. `understate` is what he plays
# down -- his own strength, his own stores, what he has already delivered.
# The frantic vassal (Gubla) writes oftenest and is oftenest right (spec 6.8):
# he is the control case that makes the liars legible.
[[correspondents]]
actor = "hatti_king"
place = "hattusa"
cadence = 6
offset = 2
topic = "grain_owed"
facts = { ships_promised = 4, ships_sailed = 1 }
understate = ["ships_sailed"]   # what you have already sent him counts for less
[[correspondents]]
actor = "carchemish_viceroy"
place = "carchemish"
cadence = 5
offset = 1
topic = "great_king_demand"
facts = { troops = 200, within = 2 }
summons_oath = "oath_hatti_grain"   # this tablet starts the clock on arrival (D25)
exaggerate = ["troops"]         # ask high, expecting to be short-changed
understate = ["within"]         # and name a deadline tighter than he needs
[[correspondents]]
actor = "alashiya_gov"
place = "alashiya"
cadence = 3
offset = 0
topic = "ships_sighted"
facts = { ships = 12, men = 30 }
exaggerate = ["ships"]          # the spec's own example (8.6): he is frightened
understate = ["men"]            # and wants troops, so his garrison shrinks
[[correspondents]]
actor = "pharaoh"
place = "egypt"
cadence = 9
offset = 4
topic = "greeting"
facts = { gold = 5 }
exaggerate = ["gold"]           # the Amarna complaint: the gold is never what the letter said
[[correspondents]]
actor = "byblos_king"
place = "byblos"
cadence = 4
offset = 1
topic = "vassal_plea"
