# THE CORRESPONDENCE GRAPH (spec 6.6). No map, no scale, no coordinates -- only
# who is how many courier-legs away, and whether the sea lies between you. This
# is the Late Bronze Age eastern Mediterranean seen from Ugarit: the Levantine
# coast, the Syrian interior, the Hittite plateau, Cyprus and the Aegean, the
# long fragile eastern road that brings the tin, and Egypt.
# ─────────────────────────────────────────────────────────────────────────────

