# The second boundary case is the first deliberate precedent test. It arrives
# within the playable opening year so the player actually sees his own words
# quoted back rather than waiting nine simulated years for the mechanic.
[[cases]]
id = "boundary_siyannu"
arrived_turn = 13
petitioner = "rapanu_farmer"
against = "shubammu_herdsman"
kind = "boundary"
unit = "cubits from the boundary oak"
claim = 70
counterclaim = 30
truth = 30
claim_text = "Rapanu says the furrow ran seventy cubits from the oak before Shubammu's herd trampled the marker."
counter_text = "Shubammu says the old grazing line begins thirty cubits from the oak and the new furrow crossed it."
correction = "The roots held a seal-stone where the herdsmen said: thirty cubits from the oak."
witness = "yarim_addu_witness"
faction = "farmers"
against_faction = "pastoralists"

