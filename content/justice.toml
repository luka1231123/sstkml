petitioner = "abdi_anu_shipwright"
against = "kuppiya_factor"
kind = "palace debt"
good = "copper"
unit = "shekels of copper"
claim = 9000
counterclaim = 3000
claim_text = "Abdi-Anu says the palace owes him 9,000 copper shekels."
counter_text = "Kuppiya says damaged timber returned; he offers 3,000."
unrest_for = -12
unrest_against = 18
unrest_split = 4
unrest_arrival = 12
waiting_unrest = 2

