# Court cases are scarce, authored resource choices. Both arguments and every
# consequence are shown before judgement; there is no hidden correct answer.
# The engine also hears actual ration debts, household hunger, extraordinary
# land dues, corvee bread and good-year reserves. Those cases use the current
# city's living cohorts and receipts, and remain available in later years.
# Further state-backed audiences hear sick households, soldiers' families,
# households supplying active works, and workers whose ration was cut while
# the king sent a foreign gift. Awards remain actual household grain; they
# do not cure disease, recall troops, finish works or retract diplomatic gifts.
# Those new audiences wait at most six unrest-charged fortnights after grace.

[[cases]]
