# Justice (spec 6.19). Cases are authored because a dispute is social history,
# not a random number. Their arrival is fixed; only the delay before a witness
# writes back is drawn from the justice substream.

[rules]
waiting_unrest_after = 6
waiting_unrest = 8
correct_legitimacy = 20
wrong_legitimacy = -35
favoured_mood = 60
refused_mood = -60
split_mood = -20
defer_mood = -30
correction_min = 2
correction_max = 6

[[cases]]
id = "boundary_ashiranu"
arrived_turn = 1
petitioner = "ashiranu_vintner"
against = "ili_rapihu_shepherd"
kind = "boundary"
unit = "cubits from the old fig tree"
claim = 60
counterclaim = 20
truth = 60
claim_text = "The stone stood sixty cubits from the old fig tree until Ili-rapihu moved it in the night."
counter_text = "The stone has always stood twenty cubits out; Ashiranu ploughed past it after the winter rain."
correction = "We lifted the fallen wall. Beneath it the old dressed stone lay at sixty cubits from the fig tree."
witness = "yarim_addu_witness"
faction = "vineyards"
against_faction = "pastoralists"

