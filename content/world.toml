# ── The farming year. These are the same for every campaign in this world:
# the Levantine agricultural calendar that defines when fields are sown,
# crops harvested, and the sea is open or shut. 
[season]
sailing_open = [7, 21]
sowing       = [19, 22]
growing      = [23, 7]
harvest      = [8, 11]
threshing    = [12, 13]
low_water    = [14, 18]

# The twelfth-century downturn (spec 6.4). x = regnal year, y = the climate
# baseline that year, 100 = normal. The whole series is drawn at scenario start
# for deterministic agriculture. Divination may read current observations and
# completed records, never values later in this series.
# The curve is gentle and long. No single year announces a crisis.
[climate]
drought_curve = [
  [0, 104], [1, 100], [2, 97], [3, 99], [4, 92],
  [5, 88], [6, 91], [7, 82], [8, 78], [9, 74], [12, 68],
