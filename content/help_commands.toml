syntax = "[t] Stores [m] Muster [y] Alu [w] World — stations inside: [o] Orders [c] Counsel [o] Oaths [p] Sickness"
answer = "Stores shows counted goods, and holds the Roll and Land stations; Muster shows formations; the Alu shows institutions and works, and holds the Orders station; World shows known routes and courts, and holds the Sickness station; Court holds Justice and the Counsel station; the Shrine holds the Altar and the Oaths station. Escape closes any of them."
