# The Palace Tutor's retrieval corpus.
#
# `verbs` bind an entry to ai.parser.VERBS. Tests require exact coverage, so a
# new order cannot enter the game without entering the tutor's knowledge.
# `keys` do the same job for visible controls. Wording here is player-facing;
# internal action names never need to enter a prompt.

[[command]]
id = "help"
category = "interface"
title = "Ask for help"
syntax = "[?] Help; type a question; [Enter] ask"
answer = "Press ? in the Hall to open Help. Type any question about controls, orders, costs, or where to find something, then press Enter. Help costs no hours; Ctrl-U clears the question and Escape returns to the Hall."
examples = ["How do I send troops on campaign?", "Where can I inspect the granary?"]
keywords = ["help", "ask", "question", "instructions", "tutorial", "clear", "close"]
keys = ["?", "enter", "ctrl-u", "esc", "F1", "F2", "F3"]
verbs = []

[[command]]
id = "palette"
category = "interface"
title = "The command line"
syntax = "[:] or [`] Command; type an order; [Tab] complete; [Enter] give it"
answer = "Press colon or backtick anywhere to open the command line. Type an order in plain words and it shows the form it matched, what each word resolved to, and what it will cost before anything happens. Tab completes when there is only one answer, Up walks back through what you have typed, and Escape closes it. It knows every order the buttons know and costs the same hours; it never asks a model anything, so it answers at once whether or not one is running."
examples = ["repair the great granary", "assign chariotry to campaign at ma_hadu", "quarantine ma_hadu"]
keywords = ["command", "type", "typing", "line", "palette", "colon", "backtick", "order", "complete", "tab", "history", "text"]
keys = [":", "`", "tab", "enter", "esc", "up"]
verbs = []

[[command]]
id = "hall"
category = "interface"
title = "Hall and navigation"
syntax = "[s] Inbox [t] Stores [m] Muster [y] Alu [j] Court [v] Shrine [w] World [d] Desk [a] Tablet House [r] Roll [l] Land [:] Command"
answer = "The Hall is home. Numbered matters open their evidence or prepare an order. Its seven letter keys open the other rooms: the Scribes' Room, Storehouse, Muster, Alu, Court, Shrine, and World. Stations live inside their rooms rather than having doors of their own: Orders in the Alu, Counsel in the Court, Oaths in the Shrine, and Sickness in the World. D opens the Desk when a read letter is available, R and L are stations in the Storehouse, A is a station in the Scribes' Room, Space ends the fortnight, backslash reads the open windows to the terminal, ? opens Help, and Q leaves the game. Printed controls can also be clicked."
examples = ["Press j for the Court, then c for Counsel.", "Click a numbered concern to follow it."]
keywords = ["hall", "home", "dashboard", "go", "open", "place", "navigation", "concern", "mouse", "click", "leave", "quit"]
keys = ["s", "d", "t", "m", "y", "j", "v", "w", "r", "l", "a", "space", "\\", "?", "q"]
verbs = []

[[command]]
id = "inbox"
category = "interface"
title = "Inbox and tablets"
syntax = "[s] Inbox; [Up/Down] choose; [Enter] read; [u] unread; [a] all"
answer = "Open the Inbox with S. Choose a tablet with Up and Down or click its row. Enter breaks an unread seal for two hours and keeps the tablet in the same window; U shows unread tablets and A shows the whole pile."
examples = ["How do I read a letter?", "Show all tablets in the Inbox."]
keywords = ["inbox", "stack", "letter", "tablet", "mail", "unread", "read", "sender", "filter", "correspondence"]
keys = ["up", "down", "u"]
verbs = []

[[command]]
id = "counsel"
category = "interface"
title = "Counsel and ordinary-language orders"
syntax = "[j] Court, then [c] Counsel; type an order or question; [Enter] tell Yabninu"
answer = "Counsel is a station in the Court: open the Court with J and press C. Say what you want in ordinary language. Clear valid orders are carried out immediately; compound orders all succeed or none do. Questions cost one hour, while orders cost whatever their acts cost. Ctrl-U clears the line."
examples = ["Give the palace smiths 7000 qa.", "Send the household troops to campaign at Carchemish."]
keywords = ["counsel", "yabninu", "order", "command", "ordinary", "language", "type", "question", "compound", "atomic"]
keys = ["c"]
verbs = []

[[command]]
