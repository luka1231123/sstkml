name: Build game packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxext6 libxrender1 libxt6
      - name: Install build tools
        run: python -m pip install -r packaging/requirements.txt
      - name: Build both editions
        run: python tools/build_packages.py
      - name: Open Linux packages on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/inspect_packages.py
      - name: Open Windows packages
        if: runner.os == 'Windows'
        run: python tools/inspect_packages.py
      - name: Upload native downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-${{ runner.os }}-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
